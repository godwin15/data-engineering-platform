name: Data Quality CI

on:
  push:
  pull_request:

jobs:
  quality-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml clickhouse-connect

      - name: Validate YAML configurations
        run: PYTHONPATH=. python scripts/validate_quality_configs.py

      - name: Run offline unit tests
        run: python -m unittest discover -s tests/data_quality -v

table: silver_holdings
database: wealth_management
tenant_column: organisation_id
primary_key: &id001
- organisation_id
- holding_id
- processing_date
checks:
- name: organisation_id_required
  type: null_check
  column: organisation_id
  severity: ERROR
- name: holding_id_required
  type: null_check
  column: holding_id
  severity: ERROR
- name: portfolio_id_required
  type: null_check
  column: portfolio_id
  severity: ERROR
- name: security_id_required
  type: null_check
  column: security_id
  severity: ERROR
- name: holdings_key_unique
  type: unique_key
  columns: *id001
  severity: ERROR
- name: portfolio_id_tenant_integrity
  type: cross_tenant_check
  entity_column: portfolio_id
  tenant_column: organisation_id
  reference_table: silver_portfolios
  severity: ERROR
- name: security_id_tenant_integrity
  type: cross_tenant_check
  entity_column: security_id
  tenant_column: organisation_id
  reference_table: silver_securities
  severity: ERROR
- name: unit_price_nonnegative
  type: range_check
  column: unit_price
  min: 0
  severity: WARNING
